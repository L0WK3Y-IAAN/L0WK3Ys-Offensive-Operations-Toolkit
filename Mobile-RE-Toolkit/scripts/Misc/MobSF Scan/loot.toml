name = "MobSF Scan"
description = "Automated mobile security analysis using MobSF (Mobile Security Framework)"
# Lives under Misc as the one canonical copy; declaring Android+iOS here
# (instead of "All") is what makes it show up under those platform tabs
# too, without a physical duplicate in each folder - see
