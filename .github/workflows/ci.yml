name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-and-lint:
    name: Compile-check & lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile every script
        # Catches syntax errors / typos in any script without needing its
        # third-party deps installed - this is a parse check, not an import.
        run: |
          python -m compileall -q .

      - name: Install flake8
        run: pip install flake8

      - name: Lint for real errors only
        # E9/F63/F7/F82 are syntax errors, invalid syntax in comparisons,
        # break/continue outside a loop, and undefined names - the class
        # of bug that should always fail CI. Style nits are intentionally
        # not enforced here.
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  smoke-test:
    name: Headless launcher smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r Mobile-RE-Toolkit/requirements.txt
          pip install pytest

      - name: Run smoke tests
        run: pytest tests/ -v
